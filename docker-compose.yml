services:
  postgres:         # векторная БД: pgvector (HNSW) + полнотекст (tsvector)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]

  tika:             # парсинг PDF/DOCX в текст
    image: apache/tika:latest
    ports: ["9998:9998"]

volumes:
  pg_data:
